name: Gerar post

on:
  schedule:
    # Roda toda hora no minuto 7 (UTC). O job "planejar" decide quais contas
    # têm horário agora (campo "horarios" de contas/<id>/config.json, em Brasília).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      conta:
        description: "Conta (id da pasta em contas/) ou 'todas'"
        type: string
        default: safesrc
      modo:
        description: "Modo desta execução (padrao = o do config da conta)"
        type: choice
        options: [padrao, revisao, automatico, simulacao]
        default: padrao

permissions:
  contents: write # commitar contas/<id>/historico.json
  issues: write   # criar issue de rascunho no modo revisao

jobs:
  planejar:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      contas: ${{ steps.p.outputs.contas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        env:
          CONTA_MANUAL: ${{ inputs.conta }}
        run: python3 -m bot planejar

  gerar:
    needs: planejar
    if: needs.planejar.outputs.contas != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false # uma conta falhar não derruba as outras
      matrix:
        conta: ${{ fromJSON(needs.planejar.outputs.contas) }}
    # Secrets X_ACCESS_TOKEN/X_ACCESS_TOKEN_SECRET vêm do Environment com o nome da conta.
    environment: ${{ matrix.conta }}
    concurrency:
      group: historico-${{ matrix.conta }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pesquisar e escrever
        env:
          CONTA: ${{ matrix.conta }}
          MODO: ${{ inputs.modo != 'padrao' && inputs.modo || '' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m bot gerar --conta "$CONTA"

      - name: Criar issue de rascunho
        if: hashFiles('saida/rascunho.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
          CONTA: ${{ matrix.conta }}
        run: |
          gh label create rascunho --color FBCA04 --description "Post aguardando revisão" --force
          gh label create aprovado --color 0E8A16 --description "Publicar este rascunho" --force
          gh label create publicado --color 5319E7 --description "Já publicado no X" --force
          gh label create "conta:$CONTA" --color C5DEF5 --description "Rascunho da conta $CONTA" --force
          gh issue create --title "$(cat saida/titulo.txt)" --body-file saida/rascunho.md \
            --label rascunho --label "conta:$CONTA" --assignee "$DONO"

      - name: Salvar histórico
        env:
          CONTA: ${{ matrix.conta }}
        run: |
          git config user.name "safesrcbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "contas/$CONTA/historico.json"
          if git diff --cached --quiet; then echo "Sem mudanças no histórico"; exit 0; fi
          git commit -m "historico($CONTA): novo post [skip ci]"
          # Outras contas podem ter feito push ao mesmo tempo: rebase e tenta de novo.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

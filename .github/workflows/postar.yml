name: Gerar post

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3. Minuto 7 para fugir do pico do :00.
    - cron: "7 11 * * *" # 08:07 BRT
    - cron: "7 15 * * *" # 12:07 BRT
    - cron: "7 20 * * *" # 17:07 BRT
    - cron: "7 0 * * *"  # 21:07 BRT
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo desta execução (padrao = usa a variável MODO do repositório)"
        type: choice
        options: [padrao, revisao, automatico, simulacao]
        default: padrao

permissions:
  contents: write # commitar data/historico.json
  issues: write   # criar issue de rascunho no modo revisao

# Um job por vez mexendo no histórico (compartilhado com aprovar.yml).
concurrency:
  group: safesrcbot-historico
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pesquisar e escrever
        env:
          MODO: ${{ (inputs.modo && inputs.modo != 'padrao') && inputs.modo || vars.MODO || 'revisao' }}
          INCLUIR_LINK: ${{ vars.INCLUIR_LINK || 'true' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m bot gerar

      - name: Criar issue de rascunho
        if: hashFiles('saida/rascunho.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
        run: |
          gh label create rascunho --color FBCA04 --description "Post aguardando revisão" --force
          gh label create aprovado --color 0E8A16 --description "Publicar este rascunho" --force
          gh label create publicado --color 5319E7 --description "Já publicado no X" --force
          gh issue create --title "$(cat saida/titulo.txt)" --body-file saida/rascunho.md --label rascunho --assignee "$DONO"

      - name: Salvar histórico
        run: |
          git config user.name "safesrcbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json
          if git diff --cached --quiet; then echo "Sem mudanças no histórico"; exit 0; fi
          git commit -m "historico: novo post [skip ci]"
          git pull --rebase
          git push

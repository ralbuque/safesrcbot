name: Publicar rascunho aprovado

# Dispara quando a label "aprovado" é adicionada a uma issue de rascunho.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  ler:
    # Só o dono do repositório pode aprovar.
    if: >-
      github.event.label.name == 'aprovado' &&
      contains(github.event.issue.labels.*.name, 'rascunho') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      conta: ${{ steps.l.outputs.conta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: l
        env:
          ISSUE_BODY: ${{ github.event.issue.body }} # via env, nunca interpolado no script
        run: python3 -m bot ler-issue

  publicar:
    needs: ler
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.ler.outputs.conta }}
    concurrency:
      group: historico-${{ needs.ler.outputs.conta }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar no X
        env:
          CONTA: ${{ needs.ler.outputs.conta }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m bot publicar-rascunho --conta "$CONTA"

      - name: Fechar issue
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$N" --body-file saida/comentario.md
          gh issue edit "$N" --remove-label rascunho --remove-label aprovado --add-label publicado
          gh issue close "$N"

      - name: Salvar histórico
        env:
          CONTA: ${{ needs.ler.outputs.conta }}
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "safesrcbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "contas/$CONTA/historico.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "historico($CONTA): rascunho #$N publicado [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

  avisar-falha:
    needs: [ler, publicar]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$N" --body "❌ Falha ao publicar. Veja o log: $RUN_URL. Corrija e adicione a label \`aprovado\` de novo."
          gh issue edit "$N" --remove-label aprovado
